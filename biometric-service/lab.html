<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>AdminGes · laboratorio facial</title>
<style>body{font:16px system-ui;background:#f1f5f9;color:#0f172a;margin:0;padding:24px}main{max-width:680px;margin:auto;background:white;padding:24px;border-radius:20px}input,button{padding:12px;margin:6px;border:1px solid #cbd5e1;border-radius:10px}button{cursor:pointer;background:#4338ca;color:white}video{width:100%;border-radius:16px}pre{white-space:pre-wrap;background:#eef2ff;padding:16px}small{display:block;color:#475569}</style>
<main><h1>Laboratorio SFace / YuNet</h1><p>Experimental. No registra asistencia. La prueba de vida y la calibración siguen pendientes.</p><input id="token" type="password" autocomplete="off" placeholder="Token local del servicio"><input id="person" placeholder="Identificador de prueba"><small>Usa personas y capturas autorizadas para pruebas. El token permanece solo en memoria.</small><button id="camera">Abrir cámara</button><video id="video" autoplay muted playsinline></video><button id="enroll" disabled>Capturar 3 muestras y enrolar</button><button id="compare" disabled>Comparar</button><button id="stop">Cerrar cámara</button><pre id="result" role="status">Listo</pre></main>
<script>
let stream=null,busy=false;const $=id=>document.getElementById(id);function close(){stream?.getTracks().forEach(t=>t.stop());stream=null;$('enroll').disabled=true;$('compare').disabled=true}window.addEventListener('pagehide',close);$('stop').onclick=close;
$('camera').onclick=async()=>{try{close();stream=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480},audio:false});$('video').srcObject=stream;await $('video').play();$('enroll').disabled=false;$('compare').disabled=false}catch(e){$('result').textContent=e.message}};
function image(){const c=document.createElement('canvas');c.width=$('video').videoWidth;c.height=$('video').videoHeight;c.getContext('2d').drawImage($('video'),0,0);return c.toDataURL('image/jpeg',.9).split(',')[1]}
async function run(enroll){if(busy||!stream)return;busy=true;try{const images=[];for(let i=0;i<(enroll?3:1);i++){$('result').textContent=`Captura ${i+1}: mira de frente y varía ligeramente la posición`;await new Promise(r=>setTimeout(r,1500));images.push(image())}const start=performance.now();const response=await fetch(enroll?'/experimental/enroll':'/experimental/compare',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+$('token').value},body:JSON.stringify(enroll?{person_id:$('person').value,images}:{person_id:$('person').value,image:images[0]})});const data=await response.json();$('result').textContent=JSON.stringify({...data,request_latency_ms:Math.round(performance.now()-start)},null,2)}catch(e){$('result').textContent=e.message}finally{busy=false}}
$('enroll').onclick=()=>run(true);$('compare').onclick=()=>run(false);
</script></html>
